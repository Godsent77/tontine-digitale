<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscription - Tontine Digitale</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-page" style="padding: 30px 15px;">
  <div class="auth-box" style="max-width: 500px;">
    <h2>📝 Inscription</h2>
    <p class="info-text">Remplissez vos informations et moyens de paiement pour valider votre compte.</p>
    <form id="regForm">
      
      <div class="form-group">
        <label>Votre Parrain</label>
        <input type="text" id="sponsorDisplay" class="input-readonly" readonly value="Détection du parrain...">
      </div>

      <div class="form-group">
        <label>Nom complet *</label>
        <input type="text" id="fullName" required placeholder="Jean Dupont">
      </div>
      <div class="form-group">
        <label>Email *</label>
        <input type="email" id="email" required placeholder="votre@email.com">
      </div>
      <div class="form-group">
        <label>Mot de passe *</label>
        <input type="password" id="password" required placeholder="Min 6 caractères" minlength="6">
      </div>
      <div class="form-group">
        <label>Code d'accès parrain (6 chiffres) *</label>
        <input type="text" id="accessCode" required placeholder="123456" maxlength="6">
      </div>

      <hr style="border:0; border-top:1px solid #334155; margin: 20px 0;">
      <h4 style="color:#38bdf8; margin-bottom:15px;">📱 Contacts & Moyens de paiement</h4>

      <div class="form-group">
        <label>Numéro WhatsApp *</label>
        <input type="text" id="whatsapp" required placeholder="+225 0700000000">
      </div>
      <div class="form-group">
        <label>Numéro Orange Money</label>
        <input type="text" id="orange_money" placeholder="07XXXXXXXX">
      </div>
      <div class="form-group">
        <label>Numéro Wave</label>
        <input type="text" id="wave" placeholder="01XXXXXXXX">
      </div>
      <div class="form-group">
        <label>Numéro Moov Money</label>
        <input type="text" id="moov_money" placeholder="01XXXXXXXX">
      </div>
      <div class="form-group">
        <label>Numéro MTN Money</label>
        <input type="text" id="mtn_money" placeholder="05XXXXXXXX">
      </div>
      <div class="form-group">
        <label>Adresse USDT BEP20</label>
        <input type="text" id="usdt_bep20" placeholder="0x...">
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:20px;">S'inscrire</button>
    </form>
    <p class="auth-link">Déjà un compte ? <a href="/login">Se connecter</a></p>
    <p class="auth-link"><a href="/">← Retour accueil</a></p>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const ref = params.get('ref') || '';
const sponsorInput = document.getElementById('sponsorDisplay');

if (ref) {
  sponsorInput.value = '👥 Parrain : ' + ref;
  sponsorInput.style.borderColor = '#16a34a';
  sponsorInput.style.color = '#38bdf8';
} else {
  sponsorInput.value = '⚠️ Aucun parrain dans le lien';
  sponsorInput.style.borderColor = '#d97706';
}

document.getElementById('regForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  try {
    const r = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        fullName: document.getElementById('fullName').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        accessCode: document.getElementById('accessCode').value,
        referralCode: ref,
        whatsapp: document.getElementById('whatsapp').value,
        orange_money: document.getElementById('orange_money').value,
        wave: document.getElementById('wave').value,
        moov_money: document.getElementById('moov_money').value,
        mtn_money: document.getElementById('mtn_money').value,
        usdt_bep20: document.getElementById('usdt_bep20').value
      })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    localStorage.setItem('tk', d.token);
    window.location.href = '/dashboard';
  } catch (err) {
    alert(err.message);
  }
});
</script>
</body>
</html>
