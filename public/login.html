<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - Tontine Digitale</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h2>🔐 Connexion à votre compte</h2>
      <p style="color: #666; margin-bottom: 20px;">Entrez vos identifiants pour accéder à votre espace.</p>

      <div id="errorAlert" class="alert alert-danger" style="display: none; background: #f8d7da; color: #721c24; padding: 10px; border-radius: 5px; margin-bottom: 15px;"></div>

      <form id="loginForm">
        <div class="form-group" style="margin-bottom: 15px;">
          <label style="display: block; margin-bottom: 5px; font-weight: bold;">Email :</label>
          <input type="email" id="email" required placeholder="votre@email.com" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
        </div>

        <div class="form-group" style="margin-bottom: 20px;">
          <label style="display: block; margin-bottom: 5px; font-weight: bold;">Mot de passe :</label>
          <input type="password" id="password" required placeholder="••••••••" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
        </div>

        <button type="submit" style="width: 100%; background: #27ae60; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold;">Se Connecter</button>
      </form>

      <div style="margin-top: 20px; text-align: center;">
        <p>Pas encore inscrit ? <a href="/register" style="color: #27ae60; font-weight: bold;">S'inscrire ici</a></p>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorAlert = document.getElementById('errorAlert');

      errorAlert.style.display = 'none';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (data.success && data.token) {
          localStorage.setItem('token', data.token);
          window.location.href = '/dashboard';
        } else {
          errorAlert.innerText = data.message || "Email ou mot de passe incorrect.";
          errorAlert.style.display = 'block';
        }
      } catch (err) {
        errorAlert.innerText = "Erreur de connexion au serveur. Réessayez.";
        errorAlert.style.display = 'block';
      }
    });
  </script>
</body>
</html>
