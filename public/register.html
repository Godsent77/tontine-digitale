<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscription - Tontine Digitale</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-box">
    <h2>📝 Inscription</h2>
    <p class="info-text">Vous devez avoir un code d'acces de 6 chiffres donne par votre parrain.</p>
    <form id="regForm">
      <div class="form-group">
        <label>Nom complet</label>
        <input type="text" id="fullName" required placeholder="Jean Dupont">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required placeholder="votre@email.com">
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" id="password" required placeholder="Min 6 caracteres" minlength="6">
      </div>
      <div class="form-group">
        <label>Code d'acces (6 chiffres)</label>
        <input type="text" id="accessCode" required placeholder="123456" maxlength="6">
      </div>
      <button type="submit" class="btn btn-primary btn-block">S'inscrire</button>
    </form>
    <p class="auth-link">Deja un compte ? <a href="/login.html">Se connecter</a></p>
    <p class="auth-link"><a href="/">← Retour accueil</a></p>
  </div>
</div>
<script>
document.getElementById('regForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  try {
    const params = new URLSearchParams(window.location.search);
    const ref = params.get('ref') || '';
    const r = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        fullName: document.getElementById('fullName').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        accessCode: document.getElementById('accessCode').value,
        referralCode: ref
      })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    localStorage.setItem('tk', d.token);
    window.location.href = '/dashboard.html';
  } catch (err) {
    alert(err.message);
  }
});
</script>
</body>
</html>
