<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - Tontine Digitale</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      background-color: #2c3e50;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .auth-card {
      background-color: #ffffff;
      padding: 35px;
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }
    .auth-card h2 {
      text-align: center;
      color: #1a252f;
      margin-bottom: 8px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #34495e;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #bdc3c7;
      border-radius: 6px;
      font-size: 14px;
    }
    .btn-block {
      width: 100%;
      padding: 12px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <h2>🔐 Connexion</h2>
    <p style="text-align: center; color: #7f8c8d; font-size: 14px; margin-bottom: 25px;">Accédez à votre compte Tontine Digitale</p>

    <div id="errorAlert" style="display: none; background-color: #fadbd8; color: #78281f; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; text-align: center;"></div>

    <form id="loginForm">
      <div class="form-group">
        <label>Email :</label>
        <input type="email" id="email" required placeholder="exemple@email.com">
      </div>

      <div class="form-group">
        <label>Mot de passe :</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>

      <button type="submit" class="btn btn-success btn-block">Se Connecter</button>
    </form>

    <div style="margin-top: 20px; text-align: center; font-size: 14px;">
      <p>Pas encore membre ? <a href="/register" style="color: #27ae60; font-weight: bold; text-decoration: none;">S'inscrire ici</a></p>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorAlert = document.getElementById('errorAlert');

      errorAlert.style.display = 'none';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (data.success && data.token) {
          localStorage.setItem('token', data.token);
          window.location.href = '/dashboard';
        } else {
          errorAlert.innerText = data.message || "Email ou mot de passe incorrect.";
          errorAlert.style.display = 'block';
        }
      } catch (err) {
        errorAlert.innerText = "Erreur de connexion au serveur.";
        errorAlert.style.display = 'block';
      }
    });
  </script>
</body>
</html>
