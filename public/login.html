<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion - Tontine Digitale</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-box">
    <h2>🔐 Connexion</h2>
    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required placeholder="votre@email.com">
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" id="password" required placeholder="Votre mot de passe">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
    </form>
    <p class="auth-link">Pas encore de compte ? <a href="/register.html">S'inscrire</a></p>
    <p class="auth-link"><a href="/">← Retour accueil</a></p>
  </div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    localStorage.setItem('tk', d.token);
    window.location.href = '/dashboard.html';
  } catch (err) {
    alert(err.message);
  }
});
</script>
</body>
</html>
